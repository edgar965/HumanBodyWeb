# Der Stil dieses Projekts — gelesen von `pycodestyle` und damit vom Werkzeug
# `code-qualitaet` (Hilfe → Skills).
#
# WARUM DIESE DATEI (30.08.2026)
# ==============================
# Das Werkzeug meldete 1.714 Mal E501 („line too long, 80 > 79"), verteilt auf
# 259 Dateien. Das ist keine Nachlässigkeit, sondern eine Vorgabe, die das
# Projekt nie angenommen hat: PEP 8 nennt 79 Zeichen, und diese Zahl stammt aus
# der Zeit der 80-Spalten-Terminals. Gemessen an den 35.366 Python-Zeilen des
# Projekts:
#
#     über  79 Zeichen   1.852   5,2 %
#     über  88 Zeichen     530   1,5 %
#     über 100 Zeichen     221   0,6 %
#
# Das Projekt schreibt also faktisch auf ~88 — die Vorgabe von `black`. Ein
# Bericht, der zu 99 % aus einer Regel besteht, die niemand befolgt, verdeckt
# die Befunde daneben; genau das war hier der Fall.
#
# DIE ZAHL WURDE NICHT GESETZT, UM DEN BERICHT LEER ZU BEKOMMEN. Am selben Tag
# sind die 530 Zeilen darüber tatsächlich umgebrochen worden — mit
# `Docu/umbau/zeilenumbruch.py` (Code, Gegenprobe über `ast.dump`) und
# `Docu/umbau/textumbruch.py` (Kommentare und Docstrings, Gegenprobe über den
# Baum ohne Docstrings plus Wortvergleich). Danach steht E501 bei NULL.
# Wer die Zahl erhöht, ohne umzubrechen, dreht die Regel um.
#
# `migrations` sind ausgenommen: Die schreibt Django, nicht das Projekt.
[pycodestyle]
max-line-length = 88
exclude = .git,__pycache__,node_modules,ProjektTemp,TestCharakter,*/migrations/*,vendor
