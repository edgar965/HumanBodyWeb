{% comment %}Regler „Haut angleichen“ unter der fertigen Figur (05.11.2026, Jobseite und Testseite), `Fotogenesishautangleich`. Ein Schritt nach dem Job: ändert nur den Ton, Haare und Flecken bleiben. Parameter: adresse (der Endpunkt).{% endcomment %}
<details class="fotogenesis-hautangleich" id="fotogenesis-hautangleich" data-adresse="{{ adresse }}" open>
    <summary>Haut angleichen</summary>
    <p class="hb-hinweis" data-meldung></p>
    <button type="button" class="schaltknopf" data-vorbereiten hidden>Vorbereiten</button>
    <div class="fotogenesis-hautangleich-regler" data-regler hidden>
        <label title="Stellen, die dunkler sind als die verlässliche Haut in der Nähe, gehen zu deren Ton."><span>Schatten aufhellen</span><input type="range" name="dunkel" min="0" max="100" value="0"><output></output></label>
        <label title="Stellen, die heller sind als die verlässliche Haut in der Nähe, gehen zu deren Ton."><span>Helles absenken</span><input type="range" name="hell" min="0" max="100" value="0"><output></output></label>
        <label title="Stellen, die kein Foto gut gesehen hat (Seiten, Rücken, unter Kleidern), gehen zum Ton der verlässlichen Haut, egal ob sie heller oder dunkler sind."><span>Ungesehenes ersetzen</span><input type="range" name="unsichtbar" min="0" max="100" value="0"><output></output></label>
        <label title="Poren und Haare: Stellen, die kein Foto gut gesehen hat, bekommen die Zeichnung gesehener Haut desselben Körperteils. Der Ton bleibt."><span>Zeichnung ersetzen</span><input type="range" name="zeichnung" min="0" max="100" value="0"><output></output></label>
        <label title="Die ganze Haut heller oder dunkler."><span>Haut heller/dunkler</span><input type="range" name="bezug" min="-100" max="100" value="0"><output></output></label>
        <label title="Wirkt zusammen mit den ersten drei Reglern. Klein: Jedes Körperteil bleibt bei seinem Ton. Groß: Auch Rumpf, Arme und Beine gleichen sich an."><span>Reichweite</span><input type="range" name="reichweite" min="0" max="100" value="50"><output></output></label>
        <div class="fotogenesis-hautangleich-knoepfe">
            <button type="button" class="schaltknopf" data-speichern>Speichern</button>
            <button type="button" class="schaltknopf" data-zuruecksetzen>Zurücksetzen</button>
        </div>
    </div>
</details>
